<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<script src="js/config.js?v=18"></script>
<script src="js/theme-init.js?v=18"></script>
<script src="js/auth-init.js?v=18"></script>
<link rel="stylesheet" href="css/base.css?v=18">
<link rel="stylesheet" href="css/layout.css?v=18">
<link rel="stylesheet" href="css/components.css?v=18">
<link rel="stylesheet" href="css/charts.css?v=18">
<link rel="stylesheet" href="css/home.css?v=18">
</head>
<body>
<script src="js/auth-gate.js?v=18"></script>
<div id="header-root"></div>

<main class="page-shell">
  <div class="page-header">
    <div>
      <div class="eyebrow" id="home-date"></div>
      <h1 class="page-title" id="home-greeting">Welcome back</h1>
    </div>
  </div>

  <div class="two-col home-top-row">
    <section class="section" id="section-currently-reading">
      <div class="section-heading">
        <h2>Currently Reading</h2>
        <a class="see-all" href="currently-reading.html">See all →</a>
      </div>
      <div id="currently-reading-rail" class="rail"></div>
    </section>

    <section class="section panel" id="goal-panel">
      <div class="eyebrow">Reading Goal</div>
      <div id="goal-content" style="margin-top:14px;"></div>
    </section>
  </div>

  <div class="two-col">
    <div>
      <section class="section" id="section-this-month">
        <div class="section-heading">
          <h2 id="this-month-heading">This Month</h2>
          <a class="see-all" id="this-month-see-all" href="history.html">See all →</a>
        </div>
        <div id="this-month-rail" class="rail"></div>
      </section>

      <section class="section" id="section-up-next">
        <div class="section-heading">
          <h2>Up Next</h2>
          <a class="see-all" href="want-to-read.html">See all →</a>
        </div>
        <div id="up-next-rail" class="rail"></div>
      </section>
    </div>

    <div>
      <section class="section panel" id="stats-panel">
        <div class="eyebrow">This Year So Far</div>
        <div id="mini-stats" class="kv-list" style="margin-top:14px;"></div>
      </section>
    </div>
  </div>
</main>

<script src="js/storage.js?v=18"></script>
<script src="js/books-api.js?v=18"></script>
<script src="js/utils.js?v=18"></script>
<script src="js/charts.js?v=18"></script>
<script src="js/nav.js?v=18"></script>
<script src="js/add-book.js?v=18"></script>
<script src="js/book-preview.js?v=18"></script>
<script src="js/home.js?v=18"></script>
</body>
</html>
