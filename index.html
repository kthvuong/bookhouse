<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<script src="js/config.js"></script>
<script src="js/theme-init.js"></script>
<script src="js/auth-init.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/charts.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<script src="js/auth-gate.js"></script>
<div id="header-root"></div>

<main class="page-shell">
  <div class="page-header">
    <div>
      <div class="eyebrow" id="home-date"></div>
      <h1 class="page-title" id="home-greeting">Welcome back</h1>
    </div>
  </div>

  <section class="section" id="section-currently-reading">
    <div class="section-heading">
      <h2>Currently Reading</h2>
      <a class="see-all" href="currently-reading.html">See all →</a>
    </div>
    <div id="currently-reading-rail" class="rail"></div>
  </section>

  <div class="two-col">
    <div>
      <section class="section" id="section-this-month">
        <div class="section-heading">
          <h2 id="this-month-heading">This Month</h2>
        </div>
        <div id="this-month-rail" class="rail"></div>
      </section>

      <section class="section" id="section-recent">
        <div class="section-heading">
          <h2>Recent Reads</h2>
          <a class="see-all" href="library.html?status=finished">See all →</a>
        </div>
        <div id="recent-rail" class="rail"></div>
      </section>

      <section class="section" id="section-up-next">
        <div class="section-heading">
          <h2>Up Next</h2>
          <a class="see-all" href="want-to-read.html">See all →</a>
        </div>
        <div id="up-next-rail" class="rail"></div>
      </section>
    </div>

    <div>
      <section class="section panel" id="goal-panel">
        <div class="eyebrow">Reading Goal</div>
        <div id="goal-content" style="margin-top:14px;"></div>
      </section>

      <section class="section panel" id="stats-panel" style="margin-top:24px;">
        <div class="eyebrow">This Year So Far</div>
        <div id="mini-stats" class="kv-list" style="margin-top:14px;"></div>
      </section>
    </div>
  </div>
</main>

<script src="js/storage.js"></script>
<script src="js/books-api.js"></script>
<script src="js/utils.js"></script>
<script src="js/charts.js"></script>
<script src="js/nav.js"></script>
<script src="js/add-book.js"></script>
<script src="js/book-preview.js"></script>
<script src="js/home.js"></script>
</body>
</html>
