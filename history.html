<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookhouse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Reading History</title>
<script src="js/config.js?v=45"></script>
<script src="js/theme-init.js?v=45"></script>
<script src="js/auth-init.js?v=45"></script>
<link rel="stylesheet" href="css/base.css?v=45">
<link rel="stylesheet" href="css/layout.css?v=45">
<link rel="stylesheet" href="css/components.css?v=45">
<link rel="stylesheet" href="css/history.css?v=45">
</head>
<body>
<script src="js/auth-gate.js?v=45"></script>
<div id="header-root"></div>
<div class="page-shell wide" style="padding-top:20px;padding-bottom:0;"><div id="subnav-root"></div></div>

<main class="page-shell wide">
  <div class="page-header">
    <div>
      <h1 class="page-title">Reading History</h1>
      <p class="page-subtitle">Browse what you read, month by month.</p>
    </div>
  </div>

  <div class="year-switcher">
    <button id="prev-year">←</button>
    <span class="year-figure" id="year-label"></span>
    <button id="next-year">→</button>
  </div>

  <div class="month-grid" id="month-grid"></div>
  <div class="month-detail-panel" id="month-detail" hidden></div>
</main>

<script src="js/storage.js?v=45"></script>
<script src="js/sync.js?v=45"></script>
<script src="js/reviews.js?v=45"></script>
<script src="js/books-api.js?v=45"></script>
<script src="js/utils.js?v=45"></script>
<script src="js/nav.js?v=45"></script>
<script src="js/add-book.js?v=45"></script>
<script src="js/book-preview.js?v=45"></script>
<script src="js/history.js?v=45"></script>
</body>
</html>
